pluginManagement {
    repositories {
        maven { url = 'https://maven.parchmentmc.org' }
        maven { url = 'https://maven.minecraftforge.net/' }
        maven { url = 'https://maven.fabricmc.net/' }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
    id 'fabric-loom' version "${fabric_loom_version}" apply false
}

rootProject.name = 'Template' //меняй

//Рекомендуется писать все в common, иначе хз зачем тебе эта либа, юзай architecture
include 'bridge' // не писать что либо вообще!
include 'common'
include 'fabric'
include 'forge'
